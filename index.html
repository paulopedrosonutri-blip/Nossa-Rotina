<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Nossa Rotina</title>
<style>
:root{--bg:#faf7fb;--card:#fff;--txt:#2d2437;--mut:#7a6f85;--pri:#7c3aed;--ok:#16a34a;--warn:#dc2626;--line:#ece6f2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1622;--card:#261f30;--txt:#f1ebf7;--mut:#a79bb5;--pri:#a78bfa;--ok:#4ade80;--warn:#f87171;--line:#3a3146}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding-bottom:190px}
header{padding:16px 16px 8px;font-size:22px;font-weight:700}
nav{display:flex;gap:6px;padding:0 12px;overflow-x:auto}
nav button{flex:1;border:0;padding:10px 8px;border-radius:12px;background:var(--card);color:var(--txt);font-size:15px;white-space:nowrap;border:1px solid var(--line)}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1}
.mut{color:var(--mut);font-size:14px}
.big{font-size:26px;font-weight:700}
.del{background:none;border:0;color:var(--warn);font-size:18px;padding:4px}
.ed{background:none;border:0;font-size:18px;padding:4px}
.ck{font-size:22px;background:none;border:0;padding:0}
h3{margin:16px 4px 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.btnPri{width:100%;padding:12px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;margin-top:8px}
#dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:50px 12px 14px}
#mic{position:absolute;left:50%;top:-36px;transform:translateX(-50%);width:72px;height:72px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
#mic.ouvindo{background:var(--warn);animation:pulso 1s infinite}
@keyframes pulso{50%{transform:translateX(-50%) scale(1.08)}}
#resp{min-height:40px;font-size:15px;text-align:center;margin-bottom:8px}
form{display:flex;gap:8px}
input{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:16px;min-width:0}
form button{padding:12px 16px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px}
.ex{font-size:12px;color:var(--mut);margin-top:8px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div id="login" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:10;padding:24px;align-items:center;justify-content:center;flex-direction:column">
  <div class="card" style="width:100%;max-width:360px">
    <div class="big" style="margin-bottom:12px">🌷 Nossa Rotina</div>
    <form id="loginForm" style="flex-direction:column">
      <input id="email" type="email" placeholder="E-mail" autocomplete="username" style="margin-bottom:8px">
      <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" style="margin-bottom:8px">
      <button style="width:100%">Entrar</button>
    </form>
    <div id="loginMsg" class="mut" style="margin-top:10px"></div>
  </div>
</div>
<header>🌷 Nossa Rotina <small id="versao" style="font-size:12px;color:var(--mut);font-weight:400">versão 2026-10-29 e</small>
  <button id="atualizar" style="float:right;font-size:14px;padding:6px 10px;border:0;border-radius:10px;background:var(--pri);color:#fff">🔄 Atualizar</button>
</header>
<nav id="abas">
  <button data-aba="hoje" class="on">Hoje</button>
  <button data-aba="gastos">Gastos</button>
  <button data-aba="rotina">Rotina</button>
  <button data-aba="metas">Metas</button>
</nav>
<main id="view"></main>

<div id="dock">
  <button id="mic" title="Falar">🎙️</button>
  <div id="resp" class="mut">Toque no microfone e fale. Ex: "gastei 45 reais no mercado"</div>
  <form id="form">
    <input id="txt" placeholder="ou digite aqui" autocomplete="off">
    <button>OK</button>
  </form>
  <div class="ex">
    "me lembra de ir ao médico amanhã às 15h" · "rotina tomar remédio às 8h"<br>
    "meta viagem 5000 até 31/12" · "adiciona 200 na meta viagem" · "quanto gastei esse mês"
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmtR = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const iso = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const addDias = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return iso(x); };
const brData = s => s.split('-').reverse().join('/');
const brMes = m => { const [ano, mes] = m.split('-'); return `${mes}/${ano}`; };
const capitalizar = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const pct = m => m.alvo > 0 ? Math.min(100, Math.round(m.atual / m.alvo * 100)) : 0;
const diasAte = p => Math.ceil((new Date(p + 'T00:00:00') - new Date(iso() + 'T00:00:00')) / 86400000);
const DIAS = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
const CATS = {
  'Mercado': /mercad|supermerc|feira|padaria|acougue/,
  'Transporte': /gasolin|combust|uber|onibus|estacion|pedagio|taxi|passagem/,
  'Saúde': /farm|remed|medic|consult|dentista|plano|exame/,
  'Alimentação': /restaur|ifood|lanche|pizza|almoc|jantar|cafe|sorvete/,
  'Casa': /luz|energia|agua|aluguel|condominio|internet|gas de cozinha|diarista/,
  'Lazer': /cinema|bar|viagem|passeio|show|festa/
};
const RE_HORA = /(?:(?<!\p{L})(?:às|as|a)\s+)?\d{1,2}(?::|h)(?:\d{2})?\b/iu;
const RE_DATA = /depois de amanh[aã]|amanh[aã]|\bhoje\b|\b(segunda|ter[cç]a|quarta|quinta|sexta|s[aá]bado|domingo)(-feira)?\b/i;
const RE_NUM = /(\d+(?:[.,]\d{1,2})?)/;
const RE_PRAZO = /at[ée]\s+(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?|(?:por|em)\s+(\d+)\s+meses?/i;

/* ---------- armazenamento na nuvem (Firebase) ---------- */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAI1qBDtaGG0IQ-SxEqxc9nju50AZ1wivY",
  authDomain: "nossa-rotina-e910a.firebaseapp.com",
  projectId: "nossa-rotina-e910a",
  storageBucket: "nossa-rotina-e910a.firebasestorage.app",
  messagingSenderId: "972214914164",
  appId: "1:972214914164:web:629d55a100491727dd1521"
};
// só estes dois e-mails conseguem entrar (também travado nas regras do banco)
const EMAILS_PERMITIDOS = ['paulopedrosonutri@gmail.com', 'vanessaccarvalhopedroso@hotmail.com'];
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
// cada pessoa tem a sua base: o Paulo mantém os dados que já existem, a Vanessa começa do zero
let docRef = null;
let db = { compromissos: [], gastos: [], rotina: [], metas: [] };
let pronto = false; // só grava depois de ler a nuvem, para nunca apagar dados por engano
let relDe = iso().slice(0, 4) + '-01'; // período do relatório (mês inicial)
let relAte = iso().slice(0, 4) + '-12'; // período do relatório (mês final)
function salvar() {
  if (!pronto || !docRef) return;
  docRef.set(db).catch(() => responder('⚠️ Não consegui salvar agora. Verifique a internet.'));
}
function iniciarSync() {
  docRef.onSnapshot(snap => {
    const d = snap.data() || {};
    db = {
      compromissos: d.compromissos || [], gastos: d.gastos || [],
      rotina: d.rotina || [], metas: d.metas || []
    };
    if (!pronto) {
      pronto = true;
      render();
      checarLembretes();
      setInterval(checarLembretes, 30000);
    } else {
      render();
    }
  }, err => responder('⚠️ Sem acesso aos dados: ' + err.message));
}

/* ---------- entendimento dos comandos ---------- */
function extrairHora(s) {
  const m = s.match(/(\d{1,2})(?::|h)(\d{2})?/i);
  if (!m) return null;
  const h = +m[1], min = m[2] ? +m[2] : 0;
  if (h > 23 || min > 59) return null;
  return { hora: String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0') };
}
function extrairData(s) {
  const n = norm(s);
  const hoje = new Date();
  if (/depois de amanha/.test(n)) return addDias(hoje, 2);
  if (/amanha/.test(n)) return addDias(hoje, 1);
  for (let i = 0; i < 7; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    if (new RegExp('\\b' + DIAS[d.getDay()] + '\\b').test(n)) return iso(d);
  }
  return iso(hoje);
}
// prazo da meta: "até 31/12", "até 31/12/2027" ou "por 6 meses"
function extrairPrazo(s) {
  const m = s.match(RE_PRAZO);
  if (!m) return { prazo: null, trecho: '' };
  if (m[4]) { const d = new Date(); d.setMonth(d.getMonth() + +m[4]); return { prazo: iso(d), trecho: m[0] }; }
  const hoje = new Date();
  const ano = m[3] ? +m[3] : hoje.getFullYear();
  let d = new Date(ano, +m[2] - 1, +m[1]);
  if (!m[3] && d < hoje) d = new Date(ano + 1, +m[2] - 1, +m[1]);
  return { prazo: iso(d), trecho: m[0] };
}
// tira do texto original as palavras de comando, data e hora, sobrando o título
function limpar(s) {
  return s
    .replace(RE_HORA, ' ').replace(RE_DATA, ' ')
    .replace(/\b(me lembra de|me lembra|me lembrar de|lembrete|lembrar de|lembrar|agendar|agenda|anotar|anota|adiciona|adicionar|compromisso|rotina|reais|real)\b/gi, ' ')
    .replace(/\s+/g, ' ').replace(/^[\s:,\-]+|[\s,.:]+$/g, '')
    .replace(/^de /i, '').replace(/\s+(na|no|em|pra|para)$/i, '').trim();
}

function addCompromisso(orig) {
  const h = extrairHora(orig.replace(RE_DATA, ' '));
  const data = extrairData(orig);
  const titulo = limpar(orig);
  if (!titulo) return 'Diga o compromisso. Exemplo: me lembra de ir ao médico amanhã às 15h.';
  db.compromissos.push({ id: uid(), titulo: capitalizar(titulo), data, hora: h ? h.hora : null, avisado: false, avisadoAntes: false });
  return `Anotado: ${capitalizar(titulo)}, ${data === iso() ? 'hoje' : brData(data)}${h ? ' às ' + h.hora : ''}.`;
}

function addRotina(orig) {
  const h = extrairHora(orig);
  const titulo = limpar(orig);
  if (!titulo) return 'Diga o que fazer. Exemplo: rotina tomar remédio às 8h.';
  const agora = new Date().toTimeString().slice(0, 5);
  db.rotina.push({
    id: uid(), titulo: capitalizar(titulo), hora: h ? h.hora : null, feitos: {},
    // se o horário já passou ao cadastrar, não avisa hoje
    avisadoEm: h && h.hora <= agora ? iso() : null
  });
  return `Rotina: ${capitalizar(titulo)}${h ? ' às ' + h.hora : ''}.`;
}

function addGasto(orig) {
  const m = orig.match(RE_NUM);
  if (!m) return 'Diga o valor. Exemplo: gastei 45 reais no mercado.';
  const valor = parseFloat(m[1].replace(',', '.'));
  let desc = orig.replace(m[1], ' ')
    .replace(/\b(gastei|gasto|gastar|paguei|pagamos|pagar|comprei|despesa|reais|real)\b/gi, ' ')
    .replace(/\br\$/gi, ' ')
    .replace(/\s+/g, ' ').trim()
    .replace(/^(com|no|na|em|de|do|da|pra|para)\s+/i, '').trim();
  desc = capitalizar(desc || 'Sem descrição');
  const n = norm(desc);
  const cat = Object.keys(CATS).find(c => CATS[c].test(n)) || 'Outros';
  db.gastos.push({ id: uid(), valor, desc, cat, data: iso() });
  return `Anotado: ${fmtR(valor)} em ${desc} (${cat}).`;
}

function criarMeta(orig) {
  const p = extrairPrazo(orig);
  const texto = orig.replace(p.trecho, ' ');
  const m = texto.match(RE_NUM);
  if (!m) return 'Diga o valor da meta. Exemplo: meta viagem 5000 até 31/12.';
  const alvo = parseFloat(m[1].replace(',', '.'));
  const nome = texto.replace(m[1], ' ')
    .replace(/\b(meta|juntar|economizar|guardar|reais|real)\b/gi, ' ')
    .replace(/\s+/g, ' ').trim()
    .replace(/^(para|pra|de)\s+/i, '').trim();
  const nomeFinal = capitalizar(nome || 'Meta');
  db.metas.push({ id: uid(), nome: nomeFinal, alvo, atual: 0, inicio: iso(), prazo: p.prazo, aportes: [], avisadoMetaEm: null });
  return `Meta criada: ${nomeFinal}, ${fmtR(alvo)}${p.prazo ? ', até ' + brData(p.prazo) : ''}.`;
}

function progressoMeta(orig) {
  const m = orig.match(RE_NUM);
  if (!m) return 'Diga o valor. Exemplo: adiciona 200 na meta viagem.';
  const valor = parseFloat(m[1].replace(',', '.'));
  const n = norm(orig);
  // acha a meta pela primeira palavra do nome que aparece no comando ("guardei 100 no carro" -> "O carro")
  const achaPorNome = g => norm(g.nome).split(/\s+/)
    .filter(w => w.length >= 3 && w !== 'meta')
    .some(w => new RegExp('\\b' + w + '\\b').test(n));
  const meta = db.metas.find(achaPorNome) || (db.metas.length === 1 ? db.metas[0] : null);
  if (!meta) return db.metas.length ? 'Não achei essa meta. Diga o nome dela.' : 'Você ainda não tem metas. Diga "meta" e o valor.';
  meta.atual += valor;
  (meta.aportes = meta.aportes || []).push({ id: uid(), valor, data: iso() });
  return `${meta.nome}: ${fmtR(meta.atual)} de ${fmtR(meta.alvo)} (${pct(meta)}%).`;
}

function totalMes() {
  const mes = iso().slice(0, 7);
  return db.gastos.filter(g => g.data.startsWith(mes)).reduce((s, g) => s + g.valor, 0);
}

function resumo() {
  const hoje = iso();
  const compsHoje = db.compromissos.filter(c => c.data === hoje);
  const pend = db.rotina.filter(r => !r.feitos[hoje]).length;
  const partes = [`Gastos do mês: ${fmtR(totalMes())}.`];
  partes.push(compsHoje.length ? `Hoje: ${compsHoje.map(c => c.titulo).join(', ')}.` : 'Nenhum compromisso hoje.');
  partes.push(pend === 0 ? 'Rotina em dia.' : pend === 1 ? 'Falta 1 item da rotina.' : `Faltam ${pend} itens da rotina.`);
  if (db.metas.length) partes.push('Metas: ' + db.metas.map(m => `${m.nome} ${pct(m)}%`).join(', ') + '.');
  return partes.join(' ');
}

function interpretar(orig) {
  const n = norm(orig).trim();
  if (!n) return 'Não ouvi nada. Tente de novo.';
  if (/\b(quanto|mostra|mostrar|lista|listar|resumo|o que tenho|quais)\b/.test(n) && !/\d/.test(n)) return resumo();
  // rotina vem antes: "adiciona ... na rotina" não é aporte de meta
  if (/\brotina\b/.test(n)) return addRotina(orig);
  if (/\b(adiciona|adicionar|guardei|guarda|coloquei|poupei|depositei|soma|somar)\b/.test(n) && (/\bmeta\b/.test(n) || db.metas.length)) return progressoMeta(orig);
  if (/\bmeta\b/.test(n)) return criarMeta(orig);
  if (/\b(gastei|gasto|gastar|paguei|pagamos|comprei|despesa)\b/.test(n)) return addGasto(orig);
  if (/\b(lembr|lembrete|compromisso|agend|marca|consulta|reuniao)/.test(n)) return addCompromisso(orig);
  return 'Não entendi.';
}

/* ---------- voz e resposta ---------- */
function responder(t) { $('#resp').textContent = t; }
function falar(t) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'pt-BR';
  speechSynthesis.speak(u);
}
// Abre a aba onde o comando foi anotado (mesma ordem de interpretar())
function abaDoComando(orig) {
  const n = norm(orig).trim();
  if (/\brotina\b/.test(n)) return 'rotina';
  if (/\b(adiciona|adicionar|guardei|guarda|coloquei|poupei|depositei|soma|somar|meta)\b/.test(n)) return 'metas';
  if (/\b(gastei|gasto|gastar|paguei|pagamos|comprei|despesa)\b/.test(n)) return 'gastos';
  return 'hoje';
}
function processar(txt) {
  const r = interpretar(txt);
  aba = abaDoComando(txt);
  salvar(); render(); responder(r); falar(r);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function ouvir() {
  if (!SR) { responder('Seu navegador não tem comando de voz. Use o Chrome (celular Android ou PC). Por enquanto, digite abaixo.'); return; }
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission();
  if (!rec) {
    rec = new SR();
    rec.lang = 'pt-BR';
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = e => { const txt = e.results[0][0].transcript; responder('Ouvi: “' + txt + '”'); processar(txt); };
    rec.onerror = e => responder('Não ouvi direito (' + e.error + '). Tente de novo ou digite.');
    rec.onend = () => $('#mic').classList.remove('ouvindo');
  }
  $('#mic').classList.add('ouvindo');
  try { rec.start(); } catch (e) { $('#mic').classList.remove('ouvindo'); }
}

/* ---------- lembretes (enquanto o app estiver aberto) ---------- */
function avisar(msg) {
  responder('🔔 ' + msg);
  falar(msg);
  if ('Notification' in window && Notification.permission === 'granted') new Notification('Nossa Rotina', { body: msg });
}
function checarLembretes() {
  const agora = new Date();
  const hj = iso(agora);
  const hhmm = agora.toTimeString().slice(0, 5);
  let mudou = false;
  db.compromissos.forEach(c => {
    const quando = new Date(c.data + 'T' + (c.hora || '08:00') + ':00');
    const faltam = quando - agora;
    // aviso 30 minutos antes (só quando tem horário)
    if (c.hora && !c.avisadoAntes && faltam > 0 && faltam <= 30 * 60000) {
      c.avisadoAntes = true; mudou = true;
      avisar('Em 30 minutos: ' + c.titulo + ' às ' + c.hora);
    }
    // aviso na hora
    if (!c.avisado && quando <= agora) {
      c.avisado = true; mudou = true;
      avisar('Agora: ' + c.titulo + (c.hora ? ' às ' + c.hora : ''));
    }
  });
  db.rotina.forEach(r => {
    if (!r.hora || r.avisadoEm === hj || r.hora > hhmm) return;
    r.avisadoEm = hj; mudou = true; avisar('Rotina: ' + r.titulo);
  });
  // avisa todo dia, a partir das 9h, o percentual de cada meta
  if (agora.getHours() >= 9) {
    const linhas = [];
    db.metas.forEach(m => {
      if (m.avisadoMetaEm === hj) return;
      m.avisadoMetaEm = hj; mudou = true;
      linhas.push(`${m.nome}: ${pct(m)}% (${fmtR(m.atual)} de ${fmtR(m.alvo)})${m.prazo ? ', faltam ' + diasAte(m.prazo) + ' dias' : ''}`);
    });
    if (linhas.length) avisar('Metas de hoje. ' + linhas.join('. ') + '.');
  }
  if (mudou) { salvar(); render(); }
}

/* ---------- editar e apagar ---------- */
function editar(k, id) {
  const it = db[k].find(x => x.id === id);
  if (!it) return;
  if (k === 'compromissos') {
    const t = prompt('Compromisso:', it.titulo); if (t === null) return;
    const d = prompt('Data (AAAA-MM-DD):', it.data); if (d === null) return;
    const h = prompt('Hora (HH:MM). Deixe vazio para o dia todo:', it.hora || ''); if (h === null) return;
    it.titulo = capitalizar(t.trim() || it.titulo);
    it.data = /^\d{4}-\d{2}-\d{2}$/.test(d.trim()) ? d.trim() : it.data;
    it.hora = /^\d{2}:\d{2}$/.test(h.trim()) ? h.trim() : null;
    it.avisado = false; it.avisadoAntes = false;
  } else if (k === 'rotina') {
    const t = prompt('Tarefa:', it.titulo); if (t === null) return;
    const h = prompt('Hora (HH:MM). Deixe vazio se não tiver:', it.hora || ''); if (h === null) return;
    it.titulo = capitalizar(t.trim() || it.titulo);
    it.hora = /^\d{2}:\d{2}$/.test(h.trim()) ? h.trim() : null;
    it.avisadoEm = null;
  } else if (k === 'gastos') {
    const d = prompt('Descrição:', it.desc); if (d === null) return;
    const v = prompt('Valor (R$):', String(it.valor).replace('.', ',')); if (v === null) return;
    const dt = prompt('Data (AAAA-MM-DD):', it.data); if (dt === null) return;
    it.desc = capitalizar(d.trim() || it.desc);
    it.valor = parseFloat(v.replace(',', '.')) || it.valor;
    it.data = /^\d{4}-\d{2}-\d{2}$/.test(dt.trim()) ? dt.trim() : it.data;
    const n = norm(it.desc);
    it.cat = Object.keys(CATS).find(c => CATS[c].test(n)) || 'Outros';
  } else if (k === 'metas') {
    const nm = prompt('Nome da meta (centro de custo):', it.nome); if (nm === null) return;
    const al = prompt('Valor da meta (R$):', String(it.alvo).replace('.', ',')); if (al === null) return;
    const pz = prompt('Prazo (DD/MM/AAAA). Deixe vazio para sem prazo:', it.prazo ? brData(it.prazo) : ''); if (pz === null) return;
    it.nome = capitalizar(nm.trim() || it.nome);
    it.alvo = parseFloat(al.replace(',', '.')) || it.alvo;
    const mm = pz.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
    it.prazo = mm ? `${mm[3]}-${mm[2].padStart(2, '0')}-${mm[1].padStart(2, '0')}` : null;
    it.avisadoMetaEm = null;
  }
  salvar();
}

/* ---------- telas ---------- */
let aba = 'hoje';
const botoes = (k, id) => `<button class="ed" data-act="edit" data-k="${k}" data-id="${id}">✏️</button><button class="del" data-act="del" data-k="${k}" data-id="${id}">✕</button>`;
const itemComp = c => `
  <div class="card row">
    <div class="grow"><b>${esc(c.titulo)}</b>
      <div class="mut">${c.data === iso() ? 'Hoje' : brData(c.data)}${c.hora ? ' · ' + c.hora : ''}</div></div>
    ${botoes('compromissos', c.id)}
  </div>`;
const itemRot = (r, dia) => `
  <div class="card row">
    <button class="ck" data-act="rot" data-id="${r.id}">${r.feitos[dia] ? '✅' : '⬜'}</button>
    <div class="grow" style="${r.feitos[dia] ? 'text-decoration:line-through;opacity:.6' : ''}">
      <b>${esc(r.titulo)}</b>${r.hora ? `<div class="mut">${r.hora}</div>` : ''}</div>
    ${botoes('rotina', r.id)}
  </div>`;
const itemMeta = m => `
  <div class="card">
    <div class="row">
      <div class="grow"><b>${esc(m.nome)}</b>
        <div class="mut">${fmtR(m.atual)} de ${fmtR(m.alvo)} · ${pct(m)}%${m.prazo ? ' · até ' + brData(m.prazo) + ' (faltam ' + diasAte(m.prazo) + ' dias)' : ''}</div></div>
      ${botoes('metas', m.id)}
    </div>
    <div class="bar" style="margin-top:8px"><i style="width:${pct(m)}%"></i></div>
  </div>`;
const ordenarPorHora = (a, b) => (a.hora || '99:99').localeCompare(b.hora || '99:99');

function viewHoje() {
  const hoje = iso();
  const comps = db.compromissos.filter(c => c.data >= hoje)
    .sort((a, b) => (a.data + (a.hora || '99')).localeCompare(b.data + (b.hora || '99')));
  return `
    <h3>Compromissos</h3>
    ${comps.slice(0, 8).map(itemComp).join('') || '<div class="card mut">Nenhum compromisso. Diga "me lembra de..."</div>'}
    <h3>Rotina de hoje</h3>
    ${db.rotina.slice().sort(ordenarPorHora).map(r => itemRot(r, hoje)).join('') || '<div class="card mut">Rotina vazia. Diga "rotina..."</div>'}
    <h3>Gastos do mês</h3>
    <div class="card"><div class="big">${fmtR(totalMes())}</div></div>
    <h3>Metas</h3>
    ${db.metas.map(itemMeta).join('') || '<div class="card mut">Nenhuma meta. Diga "meta viagem 5000"</div>'}`;
}

function viewGastos() {
  const mes = iso().slice(0, 7);
  const lista = db.gastos.filter(g => g.data.startsWith(mes)).sort((a, b) => b.data.localeCompare(a.data));
  const total = lista.reduce((s, g) => s + g.valor, 0);
  const porCat = {};
  lista.forEach(g => { porCat[g.cat] = (porCat[g.cat] || 0) + g.valor; });
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  const nomeMes = new Date().toLocaleString('pt-BR', { month: 'long', year: 'numeric' });
  return `
    <div class="card"><div class="mut">Gastos de ${esc(nomeMes)}</div><div class="big">${fmtR(total)}</div></div>
    <h3>Por categoria</h3>
    ${cats.map(([c, v]) => `
      <div class="card">
        <div class="row"><div class="grow">${esc(c)}</div><b>${fmtR(v)}</b></div>
        <div class="bar" style="margin-top:6px"><i style="width:${total ? Math.round(v / total * 100) : 0}%"></i></div>
      </div>`).join('') || '<div class="card mut">Nenhum gasto neste mês.</div>'}
    <h3>Lançamentos do mês</h3>
    ${lista.map(g => `
      <div class="card row">
        <div class="grow"><b>${esc(g.desc)}</b><div class="mut">${brData(g.data)} · ${esc(g.cat)}</div></div>
        <b>${fmtR(g.valor)}</b>
        ${botoes('gastos', g.id)}
      </div>`).join('')}`;
}

// Relatório: gastos por mês e por centro de custo.
// Centro de custo = categoria dos gastos, e cada meta também (aportes que você registrou nela).
function dadosRelatorio() {
  const dentro = m => m >= relDe.slice(0, 7) && m <= relAte.slice(0, 7);
  const lancs = db.gastos.map(g => ({ mes: g.data.slice(0, 7), centro: g.cat, valor: g.valor }));
  db.metas.forEach(mt => (mt.aportes || []).forEach(a => lancs.push({ mes: a.data.slice(0, 7), centro: 'Meta: ' + mt.nome, valor: a.valor })));
  const periodo = lancs.filter(l => dentro(l.mes));
  const meses = [...new Set(periodo.map(l => l.mes))].sort();
  const centros = [...new Set(periodo.map(l => l.centro))].sort();
  const valor = (m, c) => periodo.filter(l => l.mes === m && l.centro === c).reduce((s, l) => s + l.valor, 0);
  return { meses, centros, valor };
}
function relatorioGastos() {
  const { meses, centros, valor } = dadosRelatorio();
  const filtros = `
    <h3>Relatório por mês e centro de custo</h3>
    <div class="row" style="margin:6px 0">
      <div class="grow"><div class="mut">De</div><input type="month" id="relDe" value="${relDe.slice(0, 7)}"></div>
      <div class="grow"><div class="mut">Até</div><input type="month" id="relAte" value="${relAte.slice(0, 7)}"></div>
    </div>`;
  if (!meses.length) return filtros + '<div class="card mut">Nenhum lançamento neste período.</div>';
  const totalCentro = c => meses.reduce((s, m) => s + valor(m, c), 0);
  const geral = centros.reduce((s, c) => s + totalCentro(c), 0);
  const linhas = meses.map(m => {
    const tot = centros.reduce((s, c) => s + valor(m, c), 0);
    return `<tr><td>${brMes(m)}</td>${centros.map(c => `<td>${valor(m, c) ? fmtR(valor(m, c)) : '-'}</td>`).join('')}<td><b>${fmtR(tot)}</b></td></tr>`;
  }).join('');
  return filtros + `
    <div class="card" style="overflow-x:auto">
      <table style="border-collapse:collapse;font-size:14px;white-space:nowrap">
        <tr><th style="text-align:left;padding:4px 8px">Mês</th>${centros.map(c => `<th style="text-align:right;padding:4px 8px">${esc(c)}</th>`).join('')}<th style="text-align:right;padding:4px 8px">Total</th></tr>
        ${linhas}
        <tr><th style="text-align:left;padding:4px 8px">Total</th>${centros.map(c => `<th style="text-align:right;padding:4px 8px">${fmtR(totalCentro(c))}</th>`).join('')}<th style="text-align:right;padding:4px 8px">${fmtR(geral)}</th></tr>
      </table>
    </div>
    <button class="btnPri" data-act="pdf">Gerar PDF</button>
    <button class="btnPri" data-act="csv" style="background:var(--ok)">Baixar planilha (Excel)</button>`;
}
function baixarCSV() {
  const { meses, centros, valor } = dadosRelatorio();
  const num = v => v.toFixed(2).replace('.', ',');
  const linhas = [['Mês', ...centros, 'Total'].join(';')];
  meses.forEach(m => {
    const tot = centros.reduce((s, c) => s + valor(m, c), 0);
    linhas.push([brMes(m), ...centros.map(c => num(valor(m, c))), num(tot)].join(';'));
  });
  const blob = new Blob(['﻿' + linhas.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'relatorio-gastos-por-centro-de-custo.csv';
  a.click();
}
function gerarPDF() {
  const { meses, centros, valor } = dadosRelatorio();
  if (!meses.length) { responder('Não há lançamentos neste período.'); return; }
  const totalCentro = c => meses.reduce((s, m) => s + valor(m, c), 0);
  const geral = centros.reduce((s, c) => s + totalCentro(c), 0);
  const cab = centros.map(c => `<th>${esc(c)}</th>`).join('');
  const linhas = meses.map(m => {
    const tot = centros.reduce((s, c) => s + valor(m, c), 0);
    return `<tr><td>${brMes(m)}</td>${centros.map(c => `<td class="n">${valor(m, c) ? fmtR(valor(m, c)) : '-'}</td>`).join('')}<td class="n"><b>${fmtR(tot)}</b></td></tr>`;
  }).join('');
  const totais = centros.map(c => `<th class="n">${fmtR(totalCentro(c))}</th>`).join('');
  const html = `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório de gastos</title>
    <style>body{font-family:Arial,sans-serif;padding:20px}h1{font-size:20px}p{color:#555}
    table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid #999;padding:5px}
    th{background:#eee}.n{text-align:right}</style></head><body>
    <h1>Relatório de gastos por mês e centro de custo</h1>
    <p>Período: ${brMes(relDe.slice(0, 7))} a ${brMes(relAte.slice(0, 7))}</p>
    <table><tr><th>Mês</th>${cab}<th>Total</th></tr>${linhas}
    <tr><th>Total</th>${totais}<th class="n">${fmtR(geral)}</th></tr></table>
    </body></html>`;
  const w = window.open('', '_blank');
  if (!w) { responder('Permita pop-ups do site para gerar o PDF.'); return; }
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 300);
}

function viewRotina() {
  const hoje = iso();
  return `
    <h3>Rotina diária (${brData(hoje)})</h3>
    ${db.rotina.slice().sort(ordenarPorHora).map(r => itemRot(r, hoje)).join('') || '<div class="card mut">Rotina vazia. Diga "rotina tomar remédio às 8h"</div>'}
    <div class="mut" style="margin:10px 4px">Toque no quadradinho para marcar como feito hoje. Amanhã tudo volta a começar desmarcado.</div>`;
}

function viewMetas() {
  return `<h3>Metas (centros de custo)</h3>
    ${db.metas.map(itemMeta).join('') || '<div class="card mut">Nenhuma meta. Diga "meta viagem 5000 até 31/12"</div>'}
    <div class="mut" style="margin:10px 4px">Diga "adiciona 200 na meta viagem" para registrar um aporte. O aviso com o percentual sai todo dia a partir das 9h, com o app aberto.</div>`;
}

function render() {
  document.querySelectorAll('#abas button').forEach(b => b.classList.toggle('on', b.dataset.aba === aba));
  const telas = { hoje: viewHoje, gastos: viewGastos, rotina: viewRotina, metas: viewMetas };
  $('#view').innerHTML = telas[aba]() + (aba === 'gastos' ? relatorioGastos() : '');
}

/* ---------- eventos ---------- */
$('#abas').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  aba = b.dataset.aba;
  render();
});
$('#view').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.dataset.id;
  if (b.dataset.act === 'csv') { baixarCSV(); return; }
  if (b.dataset.act === 'pdf') { gerarPDF(); return; }
  if (b.dataset.act === 'edit') { editar(b.dataset.k, id); render(); return; }
  if (b.dataset.act === 'del') {
    if (!confirm('Apagar este item?')) return;
    db[b.dataset.k] = db[b.dataset.k].filter(x => x.id !== id);
  } else if (b.dataset.act === 'rot') {
    const r = db.rotina.find(x => x.id === id);
    const hj = iso();
    if (r) { if (r.feitos[hj]) delete r.feitos[hj]; else r.feitos[hj] = true; }
  }
  salvar(); render();
});
$('#view').addEventListener('change', e => {
  if (e.target.id === 'relDe' && e.target.value) { relDe = e.target.value + '-01'; render(); }
  if (e.target.id === 'relAte' && e.target.value) { relAte = e.target.value + '-28'; render(); }
});
// Atualizar: apaga a versão guardada no aparelho e recarrega o site novo
$('#atualizar').addEventListener('click', async () => {
  responder('Atualizando o app...');
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) { /* segue mesmo assim */ }
  location.href = location.pathname + '?v=' + Date.now();
});
$('#mic').addEventListener('click', ouvir);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const t = $('#txt').value.trim();
  if (!t) return;
  $('#txt').value = '';
  responder('Você disse: “' + t + '”');
  processar(t);
});

$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  $('#loginMsg').textContent = 'Entrando...';
  auth.signInWithEmailAndPassword($('#email').value.trim(), $('#senha').value)
    .catch(() => { $('#loginMsg').textContent = 'E-mail ou senha incorretos.'; });
});
auth.onAuthStateChanged(user => {
  if (user && EMAILS_PERMITIDOS.includes(user.email)) {
    $('#login').style.display = 'none';
    if (!window._sync) {
      window._sync = true;
      docRef = firebase.firestore().collection('familia').doc(user.email === EMAILS_PERMITIDOS[0] ? 'dados' : 'vanessa');
      iniciarSync();
    }
  } else {
    if (user) auth.signOut();
    $('#login').style.display = 'flex';
  }
});
render();
</script>
</body>
</html>
